<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilde Works</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#fbfaf7;--fg:#1c1c1a;--muted:#5f5a52;--line:#e6e0d6;--accent:#2e4a3f;--link:#2e6b55}
@media (prefers-color-scheme:dark){:root{--bg:#1e1f21;--fg:#e4e0d8;--muted:#a49e94;--line:#34363a;--accent:#9cc4b2;--link:#9cc4b2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 20px 80px}
a{color:var(--link)}
h1{font-size:30px;line-height:1.25;margin:0 0 8px}
h2{font-size:20px;margin:36px 0 8px}
p,li{color:var(--fg)}
.muted{color:var(--muted);font-size:15px}
hr{border:0;border-top:1px solid var(--line);margin:56px 0}
nav{display:flex;gap:16px;align-items:center;margin-bottom:32px;font-size:15px}
nav img{width:32px;height:32px;border-radius:8px}
nav .name{font-weight:600;color:var(--fg);text-decoration:none;margin-right:auto}
ul{padding-left:22px}
</style>
</head>
<body>
<main>
<nav><img src="icon.png" alt=""><a class="name" href="">Tilde Works</a></nav>
<h1>Tilde Works</h1>
<p>Independent apps for Android, made in Ukraine.</p>
<h2>Folio</h2>
<p>E-book reader with OPDS catalogs, read-aloud and sync.<br>
<a href="https://play.google.com/store/apps/details?id=studio.tildeworks.folio">Google Play</a> · <a href="folio/privacy/">Privacy Policy</a></p>
<h2>Contact</h2>
<p><a href="mailto:TildeWorks.studio@gmail.com">TildeWorks.studio@gmail.com</a></p>
</main>
</body>
</html>
